services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate
    environment:
      CONNECTIONS: yjs
      LABEL_yjs: Yjs MongoDB
      URL_yjs: mongodb://mongodb:27017/yjs
      ENGINE_yjs: mongo@dbgate-plugin-mongo
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    restart: unless-stopped

  websocket:
    build:
      context: .
    command: ["npm", "run", "server"]
    environment:
      HOST: 0.0.0.0
      PORT: 1234
      MONGO_URL: mongodb://mongodb:27017/yjs
    ports:
      - "127.0.0.1:1234:1234"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/workspace
      - node_modules_v3:/workspace/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1234/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  demo:
    build:
      context: .
    command: ["npm", "run", "demo"]
    environment:
      MONGO_URL: mongodb://mongodb:27017/yjs
      API_PROXY_TARGET: http://websocket:1234
    depends_on:
      websocket:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/workspace
      - node_modules_v3:/workspace/node_modules
    restart: unless-stopped

volumes:
  node_modules_v3:
  dbgate_data:
  mongo_data:
